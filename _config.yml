# ------------------------------------------------------------------
# Site configuration
# Replace these values with your own before publishing.
# ------------------------------------------------------------------

title: Zach's Awesome Semester
tagline: Zach's course lineup, one class at a time
description: >-
  My name is Zach. I am a Senior Communication major with minors in Event Management and Finance. This is my Fall 2026 semester overview. 

# GitHub Pages project-site settings.
# TODO: set `url` to your own GitHub Pages domain (e.g. "https://<your-username>.github.io"),
# and update `baseurl` to match this repo's name: "/<repo-name>"
url: "https://zachbranum.github.io"
baseurl: "/<zachsawesomesemester>"

author: Zach Branum
email: zacharylbranum@vt.edu

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------

markdown: kramdown
kramdown:
  input: GFM

permalink: /:categories/:title/

collections:
  courses:
    output: true
    permalink: /courses/:name/

defaults:
  - scope:
      path: ""
      type: courses
    values:
      layout: course
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
